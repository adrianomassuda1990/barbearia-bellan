<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia do Bellan - Agendamento Online</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.468.0"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, runTransaction }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0lLW90e0p-bGgVvcuK6yqSHqdGE4gKhc",
      authDomain: "site-danilo-config.firebaseapp.com",
      projectId: "site-danilo-config",
      storageBucket: "site-danilo-config.firebasestorage.app",
      messagingSenderId: "109226079646",
      appId: "1:109226079646:web:256beb9a3d91afda33928f"
    };

    const app = initializeApp(firebaseConfig);
    window.dbFirestore = getFirestore(app);
    window.fs = { doc, getDoc, collection, runTransaction };

    if (typeof carregarDadosFirebase === 'function') carregarDadosFirebase();
  </script>

  <style>
    .theme-border { border-color: var(--theme-color) !important; }
    .theme-bg { background-color: var(--theme-color) !important; }
    .theme-text { color: var(--theme-color) !important; }
    #next-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body class="bg-zinc-950 min-h-screen flex justify-center p-0 sm:p-4 text-zinc-100">

  <div class="w-full max-w-md bg-zinc-900 min-h-screen sm:min-h-[750px] sm:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative border border-zinc-800">

    <div>
      <div class="bg-gradient-to-b from-zinc-800 to-zinc-900 text-white p-6 text-center relative border-b border-zinc-800">
        <div id="container-logo" class="w-20 h-20 rounded-full border-2 theme-border shadow-lg mx-auto overflow-hidden bg-zinc-950 flex items-center justify-center mb-2">
          <i data-lucide="scissors" class="w-10 h-10 theme-text"></i>
        </div>
        <h1 id="nome-barbearia-cliente" class="text-xl font-bold tracking-tight uppercase">Barbearia do Bellan</h1>
        <p class="text-xs text-zinc-400 flex items-center justify-center gap-1 mt-1 font-medium">
          <i data-lucide="shield-check" class="w-3 h-3 text-emerald-400"></i> Sistema de Agendamento Verificado
        </p>
      </div>

      <!-- Indicador de passos (só permite voltar) -->
      <div id="steps-indicator-wrapper" class="flex border-b border-zinc-800 bg-zinc-950/50 px-4 py-3 text-xs font-medium text-zinc-400 justify-between items-center">
        <button type="button" onclick="voltarPara(0)" id="step-0-indicator" class="text-zinc-500 transition-all flex items-center gap-1">0. Profissional</button>
        <span class="text-zinc-700">&gt;</span>
        <button type="button" onclick="voltarPara(1)" id="step-1-indicator" class="text-zinc-500 transition-all flex items-center gap-1">1. Serviço</button>
        <span class="text-zinc-700">&gt;</span>
        <button type="button" onclick="voltarPara(2)" id="step-2-indicator" class="text-zinc-500 transition-all flex items-center gap-1">2. Horário</button>
        <span class="text-zinc-700">&gt;</span>
        <button type="button" onclick="voltarPara(3)" id="step-3-indicator" class="text-zinc-500 transition-all flex items-center gap-1">3. Fim</button>
      </div>

      <!-- PASSO 0 -->
      <div id="step-0" class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">Selecione o Profissional</label>
          <div class="space-y-3" id="container-barbeiros-cliente">
            <p class="text-xs text-zinc-500">A carregar profissionais...</p>
          </div>
        </div>
      </div>

      <!-- PASSO 1 -->
      <div id="step-1" class="p-5 space-y-5 hidden">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">Selecione o Serviço</label>
          <div class="space-y-2" id="container-servicos-cliente"></div>
        </div>
      </div>

      <!-- PASSO 2 -->
      <div id="step-2" class="p-5 space-y-5 hidden">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-2">Selecione a Data</label>
          <input type="date" id="data-agendamento" onchange="carregarHorariosCliente()" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm theme-text font-bold focus:outline-none">
        </div>

        <div id="alerta-dia-fechado" class="hidden p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-center space-y-1">
          <p class="text-sm font-bold text-red-400">Profissional Indisponível / Fechado nesta Data!</p>
          <p class="text-xs text-zinc-400">Por favor, escolha outro dia.</p>
        </div>

        <div id="wrapper-horarios">
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Horários Disponíveis</label>
          <p class="text-[11px] text-zinc-400 mb-2" id="info-duracao-servico"></p>
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-60 overflow-y-auto pr-1" id="horarios-grid-cliente"></div>
        </div>
      </div>

      <!-- PASSO 3 -->
      <div id="step-3" class="p-5 space-y-4 hidden">
        <div class="p-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-xs text-zinc-300 flex items-start gap-2">
          <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-zinc-400"></i>
          <span>Agendamento com <b id="nome-barbeiro-resumo" class="theme-text"></b>.</span>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Seu Nome Completo *</label>
          <input type="text" id="nome-cliente" maxlength="80" placeholder="Ex: Carlos Silva" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">WhatsApp / Telefone *</label>
          <input type="tel" id="whats-cliente" maxlength="25" placeholder="Ex: (19) 99999-9999" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-zinc-100 focus:outline-none">
        </div>
      </div>

      <!-- PASSO 4 -->
      <div id="step-4" class="p-6 text-center space-y-4 hidden my-auto">
        <div class="w-16 h-16 bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto border border-emerald-500/40 shadow-xl">
          <i data-lucide="check-circle-2" class="w-10 h-10"></i>
        </div>
        <div class="space-y-2">
          <h2 class="text-xl font-bold text-zinc-100">Agendamento Registado!</h2>
          <div class="p-3.5 bg-zinc-800/50 border border-zinc-700 rounded-xl text-xs text-zinc-300 space-y-1">
            <p class="font-bold text-white">📋 Mensagem copiada automaticamente!</p>
            <p id="aviso-instrucao-canal"></p>
          </div>
        </div>
        <div id="container-botoes-manuais" class="space-y-2 pt-2"></div>
        <button onclick="location.reload()" class="w-full py-3 bg-zinc-800 text-zinc-300 font-bold text-xs rounded-xl mt-3">Novo Agendamento</button>
      </div>
    </div>

    <div id="footer-actions" class="p-4 bg-zinc-900 border-t border-zinc-800 flex flex-col gap-3">
      <button id="next-btn" onclick="nextStep()" class="w-full py-3.5 theme-bg text-zinc-950 font-bold text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
        <span>Avançar para Serviços</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
      <div class="text-center pt-1">
        <a href="admin.html" class="text-[11px] text-zinc-500 hover:text-zinc-300 flex items-center justify-center gap-1">
          <i data-lucide="lock" class="w-3 h-3"></i> Painel do Barbeiro
        </a>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    const ABRE_MIN = 7 * 60;
    const FECHA_MIN = 22 * 60;
    const DURACAO_PAUSA = 30;

    let currentStep = 0;
    let barbeiroEscolhido = null;
    let servicoEscolhido = null; // Armazenará o objeto exato do serviço
    let horarioEscolhido = "";
    let intervaloEscolhido = null;
    let ocupadosDoDia = [];
    let tokenCarregamento = 0;

    let dadosGlobais = {
      nomeBarbearia: "Barbearia do Bellan",
      logoUrl: "",
      corTema: "zinc",
      barbeiros: [
        { id: 'bellan', nome: 'Bellan', whats: '', servicos: [{ id: 'corte', nome: 'Corte de Cabelo', preco: 40, duracao: 40 }], diasFechados: [], horariosPausaPadrao: [] }
      ]
    };

    const mapaCoresHex = { zinc: "#d4d4d8", amber: "#fbbf24", emerald: "#34d399", blue: "#60a5fa" };

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function aplicarTemaVisual(corTema) {
      document.documentElement.style.setProperty('--theme-color', mapaCoresHex[corTema] || mapaCoresHex.zinc);
    }

    function atualizarIndicadorPassos(passoAtivo) {
      for (let i = 0; i <= 3; i++) {
        const btn = document.getElementById(`step-${i}-indicator`);
        if (btn) {
          btn.className = (i === passoAtivo ? "theme-text font-bold" : "text-zinc-500") + " transition-all flex items-center gap-1";
        }
      }
    }

    function minutosParaHora(m) {
      const h = Math.floor(m / 60), min = m % 60;
      return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
    }

    function hojeLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    const temConflito = (ini, fim, lista) => lista.some(o => ini < o.fim && fim > o.ini);

    const inputData = document.getElementById('data-agendamento');
    inputData.min = hojeLocal();
    inputData.value = hojeLocal();

    async function carregarDadosFirebase() {
      try {
        if (window.dbFirestore) {
          const { doc, getDoc } = window.fs;
          const snap = await getDoc(doc(window.dbFirestore, "configuracoes", "barbearia_bellan_multi"));
          if (snap.exists()) {
            const data = snap.data();
            if (data && data.barbeiros && data.barbeiros.length > 0) {
              dadosGlobais = { ...dadosGlobais, ...data };
            }
          }
          if (!dadosGlobais.barbeiros.some(b => b.id === 'bellan')) {
            dadosGlobais.barbeiros.unshift({ id: 'bellan', nome: 'Bellan', whats: '', servicos: [{ id: 'corte', nome: 'Corte', preco: 40, duracao: 40 }], diasFechados: [], horariosPausaPadrao: [] });
          }
          aplicarTemaVisual(dadosGlobais.corTema || 'zinc');
          if (dadosGlobais.nomeBarbearia) document.getElementById('nome-barbearia-cliente').textContent = dadosGlobais.nomeBarbearia;
          if (dadosGlobais.logoUrl) {
            const img = document.createElement('img');
            img.src = dadosGlobais.logoUrl;
            img.className = 'w-full h-full object-cover';
            const c = document.getElementById('container-logo');
            c.innerHTML = '';
            c.appendChild(img);
          }
        }
      } catch (err) {
        console.error(err);
      }
      aplicarTemaVisual(dadosGlobais.corTema || 'zinc');
      renderizarBarbeirosCliente();
      atualizarIndicadorPassos(0);
    }

    setTimeout(() => {
      if (!document.querySelector('#container-barbeiros-cliente input')) carregarDadosFirebase();
    }, 4000);

    function renderizarBarbeirosCliente() {
      const container = document.getElementById('container-barbeiros-cliente');
      container.innerHTML = '';

      if (!barbeiroEscolhido && dadosGlobais.barbeiros.length > 0) {
        barbeiroEscolhido = dadosGlobais.barbeiros[0];
      }

      dadosGlobais.barbeiros.forEach((b) => {
        const isSel = barbeiroEscolhido && barbeiroEscolhido.id === b.id;
        const div = document.createElement('div');
        div.className = isSel
          ? "p-4 border-2 theme-border rounded-2xl bg-zinc-800/80 cursor-pointer flex items-center justify-between"
          : "p-4 border-2 border-zinc-800 rounded-2xl cursor-pointer bg-zinc-950/40 flex items-center justify-between";
        div.onclick = () => {
          if (!barbeiroEscolhido || barbeiroEscolhido.id !== b.id) servicoEscolhido = null;
          barbeiroEscolhido = b;
          renderizarBarbeirosCliente();
        };
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold theme-text border border-zinc-700">${esc((b.nome || '?').charAt(0))}</div>
            <div>
              <div class="font-bold text-sm text-zinc-100">${esc(b.nome)} ${b.id === 'bellan' ? '(Proprietário)' : ''}</div>
              <div class="text-xs text-zinc-400">Profissional Especializado</div>
            </div>
          </div>
          <input type="radio" name="barbeiro" ${isSel ? 'checked' : ''} class="w-4 h-4" onclick="return false;">
        `;
        container.appendChild(div);
      });
    }

    function voltarPara(passo) {
      if (passo < currentStep) irParaPasso(passo);
    }

    function irParaPasso(passo) {
      ['step-0', 'step-1', 'step-2', 'step-3'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('next-btn').disabled = false;

      if (passo === 0) {
        document.getElementById('step-0').classList.remove('hidden');
        document.getElementById('next-btn').innerHTML = '<span>Avançar para Serviços</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
      } else if (passo === 1) {
        carregarServicosCliente();
        document.getElementById('step-1').classList.remove('hidden');
        document.getElementById('next-btn').innerHTML = '<span>Avançar para Horários</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
      } else if (passo === 2) {
        document.getElementById('step-2').classList.remove('hidden');
        document.getElementById('next-btn').innerHTML = '<span>Confirmar Dados</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
        carregarHorariosCliente();
      } else if (passo === 3) {
        document.getElementById('nome-barbeiro-resumo').textContent = barbeiroEscolhido.nome;
        document.getElementById('step-3').classList.remove('hidden');
        document.getElementById('next-btn').innerHTML = '<span>Finalizar Agendamento</span> <i data-lucide="check" class="w-4 h-4"></i>';
      }
      currentStep = passo;
      atualizarIndicadorPassos(currentStep);
      lucide.createIcons();
    }

    // CORREÇÃO APLICADA AQUI: Identificação por ID ou índice para evitar conflitos de nomes iguais
    function carregarServicosCliente() {
      const servicos = barbeiroEscolhido.servicos && barbeiroEscolhido.servicos.length
        ? barbeiroEscolhido.servicos
        : [{ id: 'corte', nome: 'Corte de Cabelo', preco: 40, duracao: 40 }];
      const container = document.getElementById('container-servicos-cliente');
      container.innerHTML = '';

      // Garante que se nenhum foi escolhido (ou o anterior sumiu), pega o primeiro
      if (!servicoEscolhido || !servicos.some(s => (s.id && s.id === servicoEscolhido.id) || s === servicoEscolhido)) {
        servicoEscolhido = servicos[0];
      }

      servicos.forEach((s, idx) => {
        // Atribui um ID temporário se não tiver para garantir unicidade
        if (!s.id) s.id = 'srv_idx_' + idx;

        const isSel = servicoEscolhido && servicoEscolhido.id === s.id;
        const label = document.createElement('label');
        label.className = isSel
          ? "flex items-center justify-between p-3.5 border-2 theme-border rounded-2xl bg-zinc-800/80 cursor-pointer"
          : "flex items-center justify-between p-3.5 border-2 border-zinc-800 rounded-2xl cursor-pointer bg-zinc-950/40";
        
        label.onclick = (e) => { 
          e.preventDefault(); 
          servicoEscolhido = s; 
          carregarServicosCliente(); 
        };

        label.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="radio" name="servico" ${isSel ? 'checked' : ''} class="w-4 h-4" onclick="return false;">
            <div>
              <div class="font-bold text-sm text-zinc-100">${esc(s.nome)}</div>
              <div class="text-xs text-zinc-400">⏱️ ${esc(s.duracao || 30)} min</div>
            </div>
          </div>
          <span class="font-bold text-sm ${isSel ? 'theme-text' : 'text-zinc-400'}">R$ ${esc(s.preco)}</span>
        `;
        container.appendChild(label);
      });
    }

    function calcularInicios(duracao) {
      let minimo = ABRE_MIN;
      if (inputData.value === hojeLocal()) {
        const agora = new Date();
        const agoraMin = agora.getHours() * 60 + agora.getMinutes();
        minimo = Math.max(minimo, Math.ceil((agoraMin + 1) / 5) * 5);
      }

      const pausas = (barbeiroEscolhido.horariosPausaPadrao || []).map(h => {
        const [hh, mm] = h.split(':').map(Number);
        const ini = hh * 60 + mm;
        return { ini, fim: ini + DURACAO_PAUSA };
      });

      const bloqueios = [...ocupadosDoDia, ...pausas].sort((a, b) => a.ini - b.ini);
      const inicios = [];
      const preencher = (de, ate) => {
        for (let t = de; t + duracao <= ate; t += duracao) inicios.push({ ini: t, fim: t + duracao });
      };

      let cursor = minimo;
      for (const b of bloqueios) {
        preencher(cursor, Math.min(b.ini, FECHA_MIN));
        cursor = Math.max(cursor, b.fim);
      }
      preencher(cursor, FECHA_MIN);
      return inicios;
    }

    async function carregarHorariosCliente() {
      const dataSel = inputData.value;
      if (!dataSel || !barbeiroEscolhido) return;

      const [a, m, d] = dataSel.split('-').map(Number);
      const diaDaSemana = new Date(a, m - 1, d).getDay();
      const fechado = (barbeiroEscolhido.diasFechados || []).includes(diaDaSemana);

      document.getElementById('alerta-dia-fechado').classList.toggle('hidden', !fechado);
      document.getElementById('wrapper-horarios').classList.toggle('hidden', fechado);
      document.getElementById('next-btn').disabled = fechado;

      horarioEscolhido = "";
      intervaloEscolhido = null;
      if (fechado) return;

      const duracao = servicoEscolhido ? (servicoEscolhido.duracao || 30) : 30;
      document.getElementById('info-duracao-servico').textContent = `Duração: ${duracao} min`;

      const meuToken = ++tokenCarregamento;
      try {
        const { doc, getDoc } = window.fs;
        const snap = await getDoc(doc(window.dbFirestore, "agenda", `${barbeiroEscolhido.id}_${dataSel}`));
        if (meuToken !== tokenCarregamento) return;
        ocupadosDoDia = snap.exists() ? (snap.data().ocupados || []) : [];
      } catch (e) {
        console.error(e);
        ocupadosDoDia = [];
      }
      renderizarHorarios();
    }

    function renderizarHorarios() {
      const grid = document.getElementById('horarios-grid-cliente');
      grid.innerHTML = '';

      const duracao = servicoEscolhido ? (servicoEscolhido.duracao || 30) : 30;
      const lista = calcularInicios(duracao);

      if (lista.length === 0) {
        horarioEscolhido = ""; intervaloEscolhido = null;
        grid.innerHTML = `<p class="col-span-full text-xs text-zinc-500 text-center py-4">Nenhum horário disponível.</p>`;
        return;
      }

      const atual = lista.find(i => intervaloEscolhido && i.ini === intervaloEscolhido.ini) || lista[0];
      intervaloEscolhido = atual;
      horarioEscolhido = minutosParaHora(atual.ini);

      lista.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = minutosParaHora(item.ini);
        btn.className = item.ini === intervaloEscolhido.ini
          ? "p-2 border-2 theme-border bg-zinc-800 theme-text rounded-lg text-xs font-bold shadow-sm"
          : "p-2 border border-zinc-800 bg-zinc-950/40 rounded-lg text-xs font-bold text-zinc-300";
        btn.onclick = () => {
          intervaloEscolhido = item;
          horarioEscolhido = minutosParaHora(item.ini);
          renderizarHorarios();
        };
        grid.appendChild(btn);
      });
    }

    async function reservarHorario(nome, whats) {
      const { doc, collection, runTransaction } = window.fs;
      const db = window.dbFirestore;
      const data = inputData.value;
      const { ini, fim } = intervaloEscolhido;

      const refAgenda = doc(db, "agenda", `${barbeiroEscolhido.id}_${data}`);
      const refAg = doc(collection(db, "agendamentos_bellan_multi"));

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(refAgenda);
        const ocupados = snap.exists() ? (snap.data().ocupados || []) : [];
        if (temConflito(ini, fim, ocupados)) throw new Error("CONFLITO");

        tx.set(refAgenda, { ocupados: [...ocupados, { ini, fim, ag: refAg.id }] });
        tx.set(refAg, {
          barbeiroId: barbeiroEscolhido.id, cliente: nome, whatsapp: whats,
          servico: servicoEscolhido.nome, preco: servicoEscolhido.preco,
          data, horario: minutosParaHora(ini), ini, fim,
          criadoEm: new Date().toISOString()
        });
      });
    }

    async function nextStep() {
      if (currentStep === 0) {
        if (!barbeiroEscolhido) { alert("Selecione um profissional!"); return; }
        irParaPasso(1);
      } else if (currentStep === 1) {
        irParaPasso(2);
      } else if (currentStep === 2) {
        if (!horarioEscolhido) { alert("Selecione um horário!"); return; }
        irParaPasso(3);
      } else if (currentStep === 3) {
        const nome = document.getElementById('nome-cliente').value.trim();
        const whats = document.getElementById('whats-cliente').value.trim();
        const digitos = whats.replace(/\D/g, '');
        if (nome.length < 3 || digitos.length < 10 || digitos.length > 13) {
          alert("Confira o nome e o telefone (com DDD)!"); return;
        }

        const btn = document.getElementById('next-btn');
        const textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.textContent = "Reservando...";

        try {
          await reservarHorario(nome, whats);

          const texto = `✅ Agendamento Confirmado com ${barbeiroEscolhido.nome} para ${nome} às ${horarioEscolhido} (${servicoEscolhido.nome}).`;
          try { await navigator.clipboard.writeText(texto); } catch (_) {}

          document.getElementById('step-3').classList.add('hidden');
          document.getElementById('steps-indicator-wrapper').classList.add('hidden');
          document.getElementById('footer-actions').classList.add('hidden');
          document.getElementById('step-4').classList.remove('hidden');

          const caixa = document.getElementById('container-botoes-manuais');
          if (barbeiroEscolhido.whats) {
            let num = barbeiroEscolhido.whats.replace(/\D/g, '');
            if (!num.startsWith('55')) num = '55' + num;
            const link = `https://api.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(texto)}`;
            caixa.innerHTML = `<a href="${link}" target="_blank" rel="noopener" class="w-full py-3 bg-emerald-600 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2">Enviar confirmação no WhatsApp</a>`;
            document.getElementById('aviso-instrucao-canal').textContent = "Toque no botão abaixo para avisar o barbeiro.";
          } else {
            document.getElementById('aviso-instrucao-canal').textContent = "Seu horário está reservado. Até lá!";
          }
        } catch (e) {
          btn.disabled = false;
          btn.innerHTML = textoOriginal;
          if (e.message === "CONFLITO" || e.code === "permission-denied") {
            alert("⚠️ Este horário acabou de ser ocupado. Escolha outro, por favor.");
            irParaPasso(2);
          } else {
            console.error(e);
            alert("Erro ao finalizar o agendamento. Tente novamente.");
          }
        }
      }
      lucide.createIcons();
    }

    irParaPasso(0);
  </script>
</body>
</html>
